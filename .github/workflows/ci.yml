name: CI
on: [push, pull_request]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage --exclude-tags golden  # goldens are Windows-rendered; run locally

  # T2.1: no local Supabase/Docker. RLS/pgTAP tests run against the cloud dev
  # project (supabase/tests/*.sql, each wrapped in BEGIN ... ROLLBACK).
